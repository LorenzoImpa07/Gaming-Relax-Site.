<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - Gaming Relax</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="site-header">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">Gaming Relax</span>
        </div>
        <div class="nav-icons">
            <a href="https://discord.com" target="_blank" class="icon-link"><i class="fa-brands fa-discord"></i></a>
            <a href="carrello.html" class="icon-link cart-icon"><i class="fa-solid fa-cart-shopping"></i></a>
            <button class="menu-btn" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <nav class="dropdown-menu" id="dropdownMenu">
        <a href="index.html">Home</a>
        <a href="store.html">Store</a>
        <a href="art.html">Art & Design</a>
        <a href="chisiamo.html">Chi Siamo</a>
        <a href="contatti.html">Contatti</a>
    </nav>

    <main class="main-content">
        <div class="store-container">
            <h1 class="page-title">Il Nostro Store</h1>
            <div class="products-grid">
                <!-- Prodotto 1 -->
                <div class="product-card">
                    <div class="product-banner" style="background: linear-gradient(135deg, #1f4037, #99f2c8);">
                        <div class="banner-text-overlay" style="color: #000;">GALAXY</div>
                    </div>
                    <div class="product-info">
                        <span class="product-category">Tastiera Custom</span>
                        <div class="product-title-row">
                            <h2>Galaxy Edition</h2>
                        </div>
                        <div class="product-footer">
                            <span class="price">54.90 €</span>
                            <a href="carrello.html" class="btn-buy">Acquista</a>
                        </div>
                    </div>
                </div>
                <!-- Prodotto 2 -->
                <div class="product-card">
                    <div class="product-banner" style="background: linear-gradient(135deg, #2b5876, #4e4376);">
                        <div class="banner-text-overlay">AETHER</div>
                    </div>
                    <div class="product-info">
                        <span class="product-category">Tastiera Custom</span>
                        <div class="product-title-row">
                            <h2>Aether Pro</h2>
                        </div>
                        <div class="product-footer">
                            <span class="price">87.00 €</span>
                            <a href="carrello.html" class="btn-buy">Acquista</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');
        menuToggle.addEventListener('click', () => dropdownMenu.classList.toggle('active'));
    </script>
</body>
</html>
